[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallax"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=15.0",
]

[project.optional-dependencies]
dev = [
    "anyio[trio]>=4.0",
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires postgres and external APIs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
